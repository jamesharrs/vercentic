name: Deploy — Staging

on:
  push:
    branches: [develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci
      - run: cd client && npx eslint src --max-warnings 9999 --quiet
        continue-on-error: true   # warn only — don't block staging

  build-check:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci && npm run build

  server-check:
    name: Server syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: cd server && npm ci
      - name: Check all server files
        run: |
          for f in server/index.js server/db/init.js server/routes/*.js; do
            node --check "$f" && echo "✓ $f"
          done

  deploy-staging:
    name: Deploy → Vercel staging preview
    runs-on: ubuntu-latest
    needs: [build-check, server-check]
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i -g vercel@latest

      # IMPORTANT: these steps run from the repo root, NOT `working-directory: client`.
      # The Vercel project has "Root Directory" = client configured server-side.
      # If we `cd client` ourselves AND let the CLI apply Root Directory again,
      # it looks for client/client, install silently fails, and the build blows
      # up later with "vite: not found". Running from repo root lets the CLI
      # apply Root Directory exactly once, matching what Vercel's own cloud
      # build does (confirmed against a successful native Vercel deployment).
      - name: Pull Vercel env
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy preview
        id: deploy
        run: |
          # Previously: URL=$(vercel deploy ... 2>&1 | tail -1)
          # That grabbed whatever line happened to print last across merged
          # stdout+stderr — often a CLI tip (e.g. "vercel deploy --prod")
          # rather than the actual deployment URL. Capture full output,
          # check the real exit code, then pull the URL out by pattern
          # instead of by position.
          set +e
          OUTPUT=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            echo "❌ vercel deploy failed (exit $STATUS)"
            exit "$STATUS"
          fi
          URL=$(echo "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' | tail -1)
          if [ -z "$URL" ]; then
            echo "⚠️  Deployed successfully but couldn't parse a URL from Vercel's output — see log above."
          else
            echo "🔍 Staging URL: $URL"
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment PR with staging URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔍 **Staging preview deployed**\n\n${process.env.STAGING_URL}`
            })
        env:
          STAGING_URL: ${{ steps.deploy.outputs.url }}
