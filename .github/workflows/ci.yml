name: CI — Vercentic

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_call:  # allows deploy-production.yml to call this as a reusable workflow

jobs:
  # ── 1. Build check ───────────────────────────────────────────────────────────
  build:
    name: Build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        run: cd client && npm ci

      - name: Vite build
        run: cd client && npm run build

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: client/dist
          retention-days: 1

  # ── 2. Server startup check ──────────────────────────────────────────────────
  server-check:
    name: Server startup check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        run: cd server && npm ci

      - name: Syntax check all server files
        run: |
          for f in server/index.js server/db/init.js server/routes/*.js; do
            node --check "$f" && echo "✓ $f"
          done

      - name: Server starts without error
        run: |
          mkdir -p data
          echo '{"environments":[],"users":[],"roles":[]}' > data/talentos.json
          cd server && ANTHROPIC_API_KEY=test-key timeout 8 node index.js &
          sleep 4
          curl -sf http://localhost:3001/api/health && echo "✓ Server healthy"
          kill %1 2>/dev/null || true
        env:
          NODE_ENV: ci

  # ── 3. E2E tests (Playwright) ────────────────────────────────────────────────
  # Runs on: PRs to main, PRs to develop, and direct pushes to develop.
  # The old   `if: github.base_ref == 'main'`  condition was always false on
  # direct pushes (base_ref is empty) which caused GitHub to mark the job as
  # "skipped but required" → failed. Removed — CI now always runs E2E.
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: [build, server-check]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install server deps
        run: cd server && npm ci

      - name: Install client deps
        run: cd client && npm ci

      - name: Install root deps (Playwright + husky)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start server
        run: |
          mkdir -p data
          echo '{"environments":[],"users":[],"roles":[]}' > data/talentos.json
          cd server && PLAYWRIGHT_TEST=1 ANTHROPIC_API_KEY=test-key node index.js &
          # Wait up to 10s for the health endpoint to respond
          for i in $(seq 1 10); do
            curl -sf http://localhost:3001/api/health && break
            sleep 1
          done
        env:
          NODE_ENV: ci

      - name: Start client (background)
        run: cd client && npm run dev -- --port 3000 &
        env:
          VITE_API_URL: http://localhost:3001

      - name: Wait for client to be ready
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000 && break
            sleep 1
          done

      - name: Run E2E suite
        run: npx playwright test e2e/core/provisioning.spec.js --config=playwright.config.js
        working-directory: ${{ github.workspace }}
        env:
          PLAYWRIGHT_TEST: '1'
          API_URL: http://localhost:3001
          APP_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/report/
          retention-days: 7
