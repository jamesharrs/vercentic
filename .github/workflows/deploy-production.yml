name: Deploy — Production gate

on:
  push:
    branches: [main]

jobs:
  # ── Gate: full CI must pass before any deploy ────────────────────────────────
  ci-gate:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  # ── Railway deploys automatically from main via GitHub integration ────────────
  notify-railway:
    name: Railway deploy triggered
    runs-on: ubuntu-latest
    needs: ci-gate
    steps:
      - name: Confirm Railway deploy
        run: |
          echo "✅ CI passed — Railway is auto-deploying from main."
          echo "   Dashboard: https://railway.app"
          echo "   Health:    https://talentos-production-4045.up.railway.app/api/health"

  # ── Deploy client to Vercel production ───────────────────────────────────────
  deploy-vercel:
    name: Deploy client → Vercel (production)
    runs-on: ubuntu-latest
    needs: ci-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i -g vercel@latest
      # IMPORTANT: no `working-directory: client` here — same reasoning as
      # deploy-staging.yml. The Vercel project's Root Directory is already
      # "client" server-side; running from repo root lets the CLI apply it
      # exactly once instead of doubling it into a nonexistent client/client.
      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}


  # ── Post-deploy health check ──────────────────────────────────────────────────
  health-check:
    name: Post-deploy health check
    runs-on: ubuntu-latest
    needs: [notify-railway, deploy-vercel]
    steps:
      - name: Wait for Railway to stabilise
        run: sleep 30

      - name: Check API health
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            https://talentos-production-4045.up.railway.app/api/health)
          echo "API status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Check frontend
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            https://www.vercentic.com)
          echo "Frontend status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: All checks passed
        run: echo "✅ Production deployment healthy."

  # ── Auto-draft a "What's New" release note from feat: commits ────────────────
  # Scans the commits included in this deploy for Conventional Commit `feat:`
  # subjects and drafts (never auto-publishes) a new release note via a
  # shared-secret-authenticated request — no user session involved. A Super
  # Admin reviews and publishes it from Settings → Release Notes.
  # continue-on-error: the script itself is already fully non-fatal (missing
  # key, no feat: commits, API errors, etc. all just log + exit 0), but this
  # is a second layer of safety — a real deploy must never be marked failed
  # because of this best-effort, purely-additive step.
  release-note:
    name: Draft release note from feat commits
    runs-on: ubuntu-latest
    needs: health-check
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — need `before` commit for `git log before..after`
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate draft release note
        run: node scripts/generate-release-note.js
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_AFTER: ${{ github.event.after }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          RELEASE_NOTES_API_URL: https://talentos-production-4045.up.railway.app
